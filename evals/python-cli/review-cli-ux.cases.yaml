skill_id: python-cli.review-cli-ux
description: "Тест-кейсы для проверки скилла review-cli-ux"

cases:
  - id: help_output_typical_issues
    description: "--help с длинными строками, без примеров и с нестандартными флагами: конкретные проблемы, before/after, приоритеты"
    input:
      framework: "typer"
      target_audience: "ops"
      current_code_or_help_output: |
        Usage: tool [OPTIONS] COMMAND [ARGS]...

        Options:
          -out_dir TEXT   Directory where the output files generated by the command will be written to after processing completes, defaults to current
          -V              Run in verbose mode
          --Force         Do not ask
        Commands:
          run
          Del
    expected:
      must_contain:
        - "--out-dir"
        - "--force"
        - "before"
        - "after"
      quality:
        has_issues_list: true
        has_improvements: true
        has_priority_list: true
        follows_posix_gnu_conventions: true

  - id: good_cli_no_invented_issues
    description: "Нормальный help: не выдумывать критичных проблем, признать сильные стороны"
    input:
      framework: "typer"
      current_code_or_help_output: |
        Usage: backup [OPTIONS] COMMAND [ARGS]...

        Create and restore database backups.

        Options:
          --verbose  -v  Print progress details.
          --help         Show this message and exit.

        Commands:
          create   Create a new backup.
          list     List available backups.
          restore  Restore a backup by name.
    expected:
      should_not_contain:
        - "критическ"
        - "переписать"
      quality:
        does_not_invent_critical_issues: true
        has_priority_list: true

  - id: focus_error_messages
    description: "focus=сообщения об ошибках: анализировать тексты ошибок и коды выхода, а не форматирование help"
    input:
      framework: "click"
      focus: "сообщения об ошибках"
      current_code_or_help_output: |
        @click.command()
        @click.argument("path")
        def run(path):
            try:
                process(path)
            except Exception as e:
                print("Error")
                sys.exit(0)
    expected:
      must_contain:
        - "exit"
        - "stderr"
      quality:
        stays_on_requested_focus: true
        notes_wrong_exit_code: true
