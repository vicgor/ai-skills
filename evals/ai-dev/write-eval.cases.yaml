skill_id: ai-dev.write-eval
description: "Тест-кейсы для проверки скилла write-eval"

cases:
  - id: coding_agent_balanced_set
    description: "Для coding-агента должен выдать 20+ задач с should/shouldn't и reference solutions"
    input:
      system_description: "Coding-агент на Agent SDK, инструменты read_file/edit_file/run_tests"
      agent_type: coding
      known_failures: "Ломает соседние тесты; не запускает тесты; переписывает модуль целиком"
    expected:
      must_contain: [["pass@1", "pass@k", "pass^k"], "deterministic_tests", "reference", ["shouldn", "не должен"]]
      should_not_contain: ["в строгом порядке", "exact sequence"]

  - id: conversational_pass_power_k
    description: "Для customer-facing агента обязан выбрать pass^k и обосновать"
    input:
      system_description: "Support-агент, возвраты"
      agent_type: conversational
      known_failures: "Возврат без верификации личности"
      reliability_requirement: pass^k
    expected:
      must_contain: ["pass^", ["state_check", "state check", "проверка состояния"], "Unknown", "калибров"]

  - id: insufficient_failures_no_hallucination
    description: "При одном известном провале не должен выдумывать 20 задач"
    input:
      system_description: "RAG-бот по документации"
      known_failures: "Один раз ответил не по источнику"
    expected:
      # 1) признаёт нехватку данных, 2) говорит, что именно собрать/прислать. Без общих слов вроде «нужно»/«мало».
      must_contain: [["недостаточн", "недостающ", "не хватает", "данных мало", "мало данных", "блокиру", "заблокирован"], ["собрать", "собирать", "нужны", "пришлите", "предоставьте", "добавьте", "уточнить", "уточните"]]
      max_task_count: 10

  - id: no_rigid_tool_order
    description: "Грейдер tool_calls не должен требовать порядок шагов"
    input:
      system_description: "Research-агент с web_search/fetch/summarize"
      agent_type: research
      known_failures: "Цитирует неавторитетные источники; утверждения без ссылок"
    expected:
      must_contain: [["groundedness", "обоснован", "подтвержд"], ["coverage", "покрыт", "полнот"], ["source quality", "авторитетност", "авторитетн", "надёжн", "достоверн", "качество источник"]]
      should_not_contain: ["сначала web_search, затем fetch"]
