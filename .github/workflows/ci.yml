name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Validate registry, skills, eval cases and templates
        run: uv run python scripts/validate.py
      - name: Render every eval prompt (dry-run, no LLM calls)
        run: uv run python scripts/run_evals.py --provider dry-run --no-save
