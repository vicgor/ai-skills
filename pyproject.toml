[project]
name = "ai-skills"
version = "1.0.0"
description = "Personal AI prompt skills renderer"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
ai-skill = "render:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# render.py — модуль верхнего уровня; skills/ и common/ читаются рядом с ним (editable install)
only-include = ["render.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
