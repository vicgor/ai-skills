# Скилл: ai-dev.design-prompt
# Написать системный промпт с нуля или улучшить существующий.

id: ai-dev.design-prompt
version: "1.0"
status: stable
domain: ai-dev

intent: >
  Написать новый системный промпт или улучшить существующий:
  роль, тон, правила вывода, ограничения, формат ответа,
  защита от галлюцинаций и edge cases.

inputs:
  required:
    - id: mode
      description: "Режим работы: 'write' (написать с нуля) или 'improve' (улучшить существующий)"
      example: "improve"
    - id: goal
      description: "Что должен делать ассистент / какую задачу решает промпт"
      example: "Помогать разработчику писать миграции БД"
  optional:
    - id: current_prompt
      description: "Существующий промпт (обязателен при mode=improve)"
    - id: target_model
      description: "Целевая модель: GPT-4o, Claude Sonnet, Gemini Pro и т.д."
      default: "universal"
    - id: persona
      description: "Желаемая роль/персона ассистента"
      example: "Senior database engineer"
    - id: output_format
      description: "Формат ответа ассистента: markdown, plain text, JSON, mixed"
      default: "markdown"
    - id: constraints
      description: "Дополнительные ограничения или запреты"
      example: "Не предлагать решения за пределами PostgreSQL"
    - id: tone
      description: "Тон: formal, concise, friendly, Socratic и т.д."
      default: "concise and precise"

output_contract:
  sections:
    - name: diagnosis
      condition: "mode=improve"
      description: |
        Анализ текущего промпта: что работает, что сломано.
        Конкретные проблемы (нумерованный список) — расплывчатая роль, отсутствие
        ограничений вывода, риск галлюцинаций, неявные edge cases.
    - name: prompt
      required: true
      description: |
        Готовый системный промпт в code-блоке.
        Всегда содержит:
          1. Role sentence — одна строка, кто ассистент и для кого.
          2. Core responsibilities — 3–6 конкретных обязанностей.
          3. Output format rules — структура, длина, markdown/plain.
          4. Constraints — явные запреты и ограничения.
          5. Uncertainty handling — как вести себя при неполных данных.
          6. (Опционально) Persona/tone calibration.
    - name: explanation
      required: true
      description: |
        Объяснение ключевых решений (не пересказ промпта):
        почему выбрана такая роль, почему такие ограничения,
        как секция uncertainty handling снижает галлюцинации.
    - name: usage_example
      required: true
      description: |
        1–2 примера вызова: как пользователь начинает диалог
        и чего ожидать в ответе.
    - name: known_weaknesses
      required: true
      description: |
        2–4 ситуации, в которых промпт может дать плохой результат,
        и как это митигировать (в т.ч. few-shot, temperature, tools).

quality_rules:
  - rule: "Role sentence — одна строка, не более 20 слов, без вводных слов ('You are a helpful assistant')"
  - rule: "Ни одна инструкция не начинается с 'Always' без конкретного условия — это создаёт конфликты"
  - rule: "Uncertainty handling обязателен: ассистент должен знать, что делать при отсутствующих данных"
  - rule: "Формат вывода явный: если ожидается список — сказано 'bulleted list', если prose — сказано 'prose'"
  - rule: "Промпт проверяется на adversarial input: что будет, если пользователь подаст пустой запрос или противоречивые данные"
  - rule: "При mode=improve: каждое изменение в диагнозе должно иметь соответствующее исправление в промпте"

prompt_engineering_principles:
  role_sentence:
    do: "You are a senior PostgreSQL engineer helping backend developers write safe, reversible migrations."
    dont: "You are a helpful assistant that knows about databases."
  constraints_pattern:
    do: "Do not suggest solutions outside PostgreSQL unless explicitly asked."
    dont: "Try to stay focused on the topic."
  uncertainty_handling_pattern:
    do: "If the schema is not provided, ask for it before generating any SQL."
    dont: "(silence or hallucinated schema)"
  format_rule_pattern:
    do: "Respond with: (1) diagnosis in a numbered list, (2) SQL block, (3) risks as a bullet list."
    dont: "Format your response clearly."

known_failures:
  - failure: "Модель игнорирует role sentence и отвечает как generic assistant"
    cause: "Role sentence слишком абстрактна или содержит 'helpful'"
    fix: "Сделать роль domain-specific с конкретной аудиторией"
  - failure: "Промпт без uncertainty handling — модель галлюцинирует недостающие данные"
    cause: "Не указано поведение при missing inputs"
    fix: "Добавить явный блок: 'If X is not provided, ask for it before proceeding'"
  - failure: "Конфликтующие инструкции (e.g., 'be concise' и 'explain in detail')"
    cause: "Нет приоритизации правил"
    fix: "Добавить 'Unless user asks for elaboration, keep responses under N words'"
  - failure: "Промпт для одной модели плохо работает на другой"
    cause: "Инструкции заточены под специфику одного API"
    fix: "При target_model=universal: избегать model-specific синтаксиса, использовать нейтральные конструкции"
