id: ai-dev.design-prompt
version: "1.0.0"
owner: victor
status: stable
tags: [ai, llm, prompt-engineering, system-prompt, instructions, openai, anthropic, gemini]

intent: >
  Написание нового системного промпта с нуля или улучшение существующего.
  Охватывает структуру инструкций, тон, ограничения, формат вывода,
  few-shot примеры и защиту от типичных провалов модели.

use_when:
  - Нужно написать системный промпт для нового AI-функционала
  - Существующий промпт даёт непредсказуемые или нежелательные результаты
  - Нужно добавить ограничения, тон, формат вывода или few-shot примеры
  - Нужно адаптировать промпт под конкретную модель (GPT-4o, Claude, Gemini)
  - Нужно разбить большой промпт на логические секции

avoid_when:
  - Проблема не в промпте, а в данных или постобработке вывода
  - Нужна диагностика нежелательного поведения модели (используй debug-llm-output)
  - Задача — написать user message, а не system prompt

inputs:
  required:
    - name: task_description
      description: >
        Что должна делать модель. 1–3 предложения: цель, контекст,
        кто пользователь, какой вывод ожидается.
  optional:
    - name: existing_prompt
      description: "Текущий системный промпт (если есть и нужно улучшить)"
      default: ""
    - name: model
      description: >
        Целевая модель: gpt-4o, gpt-4o-mini, claude-3-5-sonnet, claude-3-haiku,
        gemini-1.5-pro, gemini-flash, или generic (без оптимизации под конкретную модель).
      default: "generic"
    - name: output_format
      description: >
        Требуемый формат вывода: plain_text, json, markdown, structured_list,
        code, или custom (описать в task_description).
      default: "plain_text"
    - name: tone
      description: >
        Тон и стиль: professional, friendly, concise, verbose, technical,
        или custom (описать).
      default: "professional"
    - name: language
      description: "Язык вывода модели: russian, english, или auto (по языку запроса)"
      default: "auto"
    - name: few_shot_examples
      description: >
        Примеры вход→выход для few-shot обучения. Формат: список пар.
        Если есть — включить в промпт. Если нет — предложить 2–3 примера.
      default: ""
    - name: constraints
      description: >
        Явные ограничения: что модель НЕ должна делать, темы которых надо избегать,
        максимальная длина ответа, и т.д.
      default: ""
    - name: prompt_style
      description: >
        Стиль структуры промпта: markdown_headers (секции с ##),
        xml_tags (<role>, <instructions>), plain (сплошной текст), или auto.
      default: "auto"

output_contract:
  format: markdown
  must_include:
    - design_rationale        # краткое объяснение ключевых решений
    - system_prompt           # готовый системный промпт в code block
    - section_breakdown       # разбор каждой секции: что делает и почему
    - few_shot_examples       # 2–3 примера вход→выход (встроены в промпт или отдельно)
    - model_specific_notes    # особенности для выбранной модели (если не generic)
    - test_cases              # 3–5 тестовых запросов для проверки промпта
    - known_weaknesses        # что промпт не покрывает / возможные провалы

prompt_template: |
  {common_style}
  {common_safety}

  Ты эксперт по prompt engineering с глубоким знанием поведения LLM (GPT-4o, Claude, Gemini).

  ## Задача: написать / улучшить системный промпт

  **Описание задачи:** {task_description}
  **Целевая модель:** {model}
  **Формат вывода модели:** {output_format}
  **Тон:** {tone}
  **Язык вывода:** {language}
  **Стиль промпта:** {prompt_style}
  **Ограничения:** {constraints}

  ## Существующий промпт (если есть)

  ```
  {existing_prompt}
  ```

  ## Few-shot примеры (если есть)

  {few_shot_examples}

  ## Требования к ответу

  ### 1. Обоснование дизайна (2–4 пункта)
  Ключевые решения: почему выбрана такая структура, как учтена модель,
  какие риски промпт закрывает.

  ### 2. Готовый системный промпт
  Полный текст в ```markdown``` или ```xml``` блоке в зависимости от prompt_style.

  Обязательные секции промпта:
  - **Роль** — кто модель, какова её цель
  - **Контекст** — необходимый background для принятия решений
  - **Инструкции** — что делать, пошагово или в виде правил
  - **Формат вывода** — точная структура ответа (если output_format не plain_text)
  - **Ограничения** — что НЕ делать (явно, не через "старайся избегать")
  - **Тон** — стиль коммуникации
  - **Few-shot примеры** — если помогают (встроить в промпт или дать отдельно)

  Правила написания:
  - Инструкции — императивные глаголы ("Отвечай", "Не используй", "Всегда проверяй")
  - Ограничения — явные запреты, не мягкие пожелания
  - Для JSON-вывода — дать точную JSON-схему с примером
  - Для {model}: учесть контекстное окно, поддержку system role, особенности следования инструкциям
  - Избегать противоречий между секциями
  - Не использовать "пожалуйста" и вежливые обращения к модели — это снижает точность

  ### 3. Разбор секций
  Таблица: секция → назначение → почему именно так сформулировано.

  ### 4. Тестовые запросы
  5 user-сообщений для проверки промпта:
  - 2 типичных (happy path)
  - 2 edge case (граничные ситуации)
  - 1 adversarial (попытка сломать / обойти инструкции)
  Для каждого — ожидаемое поведение модели.

  ### 5. Известные слабости
  Минимум 3 сценария, где промпт может дать сбой, с рекомендацией как их закрыть.

  ### 6. Заметки по модели
  Если model != generic:
  - Специфика форматирования (Claude предпочитает XML-теги, GPT-4o — markdown)
  - Особенности следования system prompt у данной модели
  - Рекомендуемые параметры (temperature, top_p) для задачи

quality_checks:
  - has_design_rationale: true
  - has_complete_system_prompt: true
  - has_section_breakdown: true
  - has_few_shot_examples: true
  - has_test_cases_with_expected_behavior: true
  - has_known_weaknesses: true
  - prompt_uses_imperative_verbs: true
  - constraints_are_explicit_not_soft: true
  - no_contradictions_between_sections: true

known_failures:
  - issue: "Промпт использует мягкие пожелания вместо явных инструкций"
    symptom: >
      Генерируется "Постарайся быть кратким" вместо "Отвечай не более 3 предложений".
      Модель игнорирует мягкие формулировки при сложных запросах.
    fix: >
      В требованиях явно указано: императивные глаголы, явные запреты.
      Если модель всё равно смягчает — добавить в existing_prompt пример жёсткой инструкции.

  - issue: "Отсутствует секция формата вывода для структурированных данных"
    symptom: >
      При output_format=json промпт не содержит JSON-схемы,
      модель возвращает JSON с непредсказуемыми полями.
    fix: >
      В требованиях: "Для JSON-вывода — дать точную JSON-схему с примером".
      Уточнить поля через constraints или task_description.

  - issue: "Few-shot примеры противоречат инструкциям"
    symptom: >
      Примеры показывают одно поведение, инструкции требуют другого.
      Модель следует примерам, игнорируя инструкции.
    fix: >
      Секция known_weaknesses в ответе должна включать проверку консистентности.
      Few-shot примеры всегда должны быть следствием инструкций, а не исключением.

  - issue: "Промпт не адаптирован под целевую модель"
    symptom: >
      При model=claude-3-5-sonnet генерируется промпт в markdown-стиле GPT.
      Claude хуже следует markdown-заголовкам, лучше — XML-тегам.
    fix: >
      Секция "Заметки по модели" обязательна при model != generic.
      При prompt_style=auto выбирать XML для Claude, markdown для GPT.

  - issue: "Нет adversarial тест-кейса"
    symptom: >
      Все 5 тестовых запросов — happy path. Промпт не проверен на попытки обхода.
    fix: >
      В требованиях явно указан состав тест-кейсов: 2 типичных, 2 edge, 1 adversarial.

examples:
  - description: "Системный промпт для customer support бота"
    task_description: >
      Модель отвечает на вопросы клиентов SaaS-продукта по биллингу и техподдержке.
      Пользователи — платящие клиенты, иногда раздражённые. Нельзя обещать возврат
      средств без подтверждения от команды.
    model: gpt-4o
    output_format: plain_text
    tone: friendly
    language: russian
    constraints: "Не обещать возврат средств. Не обсуждать конкурентов."

  - description: "Промпт для извлечения структурированных данных из текста"
    task_description: >
      Модель извлекает из неструктурированного текста поля: имя, дата, сумма, валюта.
      Входные данные — произвольный текст счёта или договора.
    model: claude-3-5-sonnet
    output_format: json
    tone: technical
    constraints: "Если поле не найдено — вернуть null, не придумывать значение."

  - description: "Code review ассистент для Python"
    task_description: >
      Модель делает ревью Python-кода: находит баги, проблемы со стилем (ruff),
      предлагает улучшения. Отвечает в формате markdown с секциями.
    model: generic
    output_format: markdown
    tone: concise
    language: english
    constraints: "Не переписывать код полностью. Только конкретные замечания с примерами."
