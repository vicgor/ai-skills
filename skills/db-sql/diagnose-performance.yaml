id: db-sql.diagnose-performance
version: "1.0.1"
owner: victor
status: stable
tags: [sql, mysql, mariadb, performance, slow-query, processlist, monitoring]

intent: >
  Диагностика проблем производительности БД по симптомам: slow query log,
  SHOW PROCESSLIST, метрики, описание проблемы.

use_when:
  - БД тормозит, но неясно почему
  - Есть slow query log или PROCESSLIST вывод
  - Нужен план диагностики с конкретными командами
  - Нужно разобраться с lock wait / deadlock

avoid_when:
  - Есть конкретный медленный запрос (используй query-optimize)

inputs:
  required:
    - name: symptoms
      description: "Описание проблемы: что происходит, когда началось"
  optional:
    - name: slow_query_log
      description: "Фрагмент slow query log"
    - name: processlist
      description: "Вывод SHOW FULL PROCESSLIST или performance_schema"
    - name: engine
      description: "БД: mysql, mariadb, postgresql"
      default: "mariadb"
    - name: environment
      description: "Окружение: prod/staging, версия, железо"
      default: "production"
    - name: metrics
      description: "Метрики если есть: CPU, IOPS, connections, QPS"

output_contract:
  format: markdown
  must_include:
    - probable_causes    # 2-3 версии от наиболее вероятной
    - diagnostic_steps   # пронумерованный план с командами
    - quick_fixes        # что можно сделать сразу
    - monitoring_queries # SQL для мониторинга проблемы
  prefer:
    - provide exact SQL/shell commands for each step
    - estimate time for each diagnostic step

prompt_template: |
  {common_style}
  {common_safety}

  Ты senior DBA, специализируешься на диагностике {engine}.
  Используй только инструменты указанного движка. Для postgresql: pg_stat_activity,
  pg_stat_statements, pg_locks, EXPLAIN (ANALYZE, BUFFERS); никогда не предлагай
  SHOW PROCESSLIST, information_schema.PROCESSLIST и slow_query_log. Для mysql/mariadb:
  PROCESSLIST, performance_schema, slow query log.

  ## Задача: диагностика проблем производительности БД

  **БД:** {engine}
  **Окружение:** {environment}
  **Метрики:** {metrics}

  ## Симптомы

  {symptoms}

  ## Slow Query Log (если есть)

  ```
  {slow_query_log}
  ```

  ## Вывод активных сессий (если есть: PROCESSLIST или pg_stat_activity)

  ```
  {processlist}
  ```

  ## Требования к ответу

  1. Вероятные причины (от наиболее к менее вероятной) — 2-3 версии.
  2. Пошаговый план диагностики с точными SQL/shell командами.
  3. Быстрые меры: что можно сделать прямо сейчас без риска.
  4. Если в выводе сессий есть ожидания блокировок (metadata lock, row lock):
     найди блокирующую сессию и покажи запрос для её поиска. Предложи
     `KILL <thread_id>` (или `KILL QUERY <thread_id>`) как быструю меру
     с пометкой риска: откат транзакции и потеря незафиксированных данных;
     сначала убедись, что сессия не критична.
  5. SQL-запросы для мониторинга: следить за состоянием во время диагностики.
  6. Если данных недостаточно — список уточняющих вопросов.

quality_checks:
  - has_probable_causes: true
  - has_diagnostic_steps_with_commands: true
  - has_quick_fixes: true
  - has_monitoring_queries: true

known_failures:
  - "Модель даёт общие советы без конкретных команд → требовать точные SQL"
  - "Модель не учитывает версию движка → указывать в environment"
